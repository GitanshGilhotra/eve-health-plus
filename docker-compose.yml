services:
  mongodb:
    image: mongo:6.0
    container_name: eve_mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.initiate() } catch (e) { rs.status() }"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eve_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: eve_backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://mongodb:27017/eve_health?replicaSet=rs0&directConnection=true
      - MONGODB_URI=mongodb://mongodb:27017/eve_health
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=f51258d5a797459113714e24ab9f127bf01bfc7d986612a51bae0bd13772cf76
      - REFRESH_SECRET=supersecretrefreshkey_for_development_only_evehealth_2026
      - RAZORPAY_KEY_ID=rzp_test_evehealth_key
      - RAZORPAY_KEY_SECRET=dev_razorpay_secret
      - PORT=4000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: eve_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodata:
  redisdata:
